server {
    listen 8181;
    host 127.0.0.1;

    location / {
        root www/html;
        index index.html;
        methods GET;
    }

    location /uploads {
        methods GET POST DELETE;
        root www/uploads;
        autoindex on;
    }

    location /cgi-bin {
        root www/cgi-bin;
        cgi_ext .py .php;
    }
}

server {
    listen 9090;
    host 127.0.0.1;

    location / {
        root www/other;
        index index.html;
        methods GET;
    }
}